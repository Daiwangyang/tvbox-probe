name: probe

# 3 小时一次。私有仓库 Actions 月额度 2000 分钟,这个频率约 900-1200 分钟,
# 留了余量。别改到半小时一次,那个会超一倍。
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装 ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: 拉种子源
        run: python fetch_seeds.py

      - name: 测速筛选
        run: python probe.py
        continue-on-error: true

      - name: 播放流畅度实测
        run: python playtest.py
        timeout-minutes: 8
        continue-on-error: true

      - name: 提交结果
        run: |
          git config user.name  "probe-bot"
          git config user.email "probe@bot.local"
          git add my.json report.md seeds.txt quarantine.json play.json
          git diff --staged --quiet && echo "无变化" && exit 0
          git commit -m "chore: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
