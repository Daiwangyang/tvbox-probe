name: probe

# 半小时一次。公开仓库 Actions 分钟数不限,单轮约 6 分钟,
# 48 次/天 ≈ 290 分钟/天,不会撞免费并发上限。
# (私有仓库只有 2000 分钟/月,那就得退回 4 小时一档。)
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: 装 ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: 拉种子源
        run: python fetch_seeds.py

      - name: 测速筛选
        run: python probe.py
        continue-on-error: true

      - name: 播放流畅度实测
        run: python playtest.py
        timeout-minutes: 8
        continue-on-error: true

      - name: 提交结果
        run: |
          git config user.name  "probe-bot"
          git config user.email "probe@bot.local"
          git add my.json report.md seeds.txt quarantine.json play.json
          git diff --staged --quiet && echo "无变化" && exit 0
          git commit -m "chore: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
